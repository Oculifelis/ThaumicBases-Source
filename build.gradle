plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    // Local copies of the jars installed in the Simply NeoForged instance (not committed, see libs/README.md).
    implementation files('libs/thaumaturge-26.1.2-NeoForge-1.1.0.jar')
    // JEI is optional: compat/TBJeiPlugin only loads when JEI finds it.
    compileOnly files('libs/jei-26.1.2-common-api-29.47.0.111.jar')
    runtimeOnly files('libs/curios-neoforge-15.0.0+26.1.2.jar')
    runtimeOnly files('libs/lithostitched-1.8.1-neoforge-26.1.jar')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            jvmArgument '-Xmx3G'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'thaumaturgicbases.selftest', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            thaumaturge_version_range: thaumaturge_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Development checks have their own mod and output; the ordinary jar contains main only.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
neoForge.addModdingDependenciesTo(sourceSets.verification)
def checkedMod = neoForge.mods.getByName(mod_id)
def checksMod = neoForge.mods.create('thaumaturgicbases_checks') {
    sourceSet sourceSets.verification
}
neoForge.runs {
    client {
        loadedMods = [checkedMod]
    }
    server {
        loadedMods = [checkedMod]
    }
    gameTestServer {
        type = 'gameTestServer'
        gameDirectory = project.file('run/verification-gametest')
        loadedMods = [checkedMod, checksMod]
        systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumaturgicbases_checks'
        systemProperty 'thaumaturgicbases.selftest', 'true'
        jvmArgument '-Xmx4G'
        jvmArgument '-XX:ActiveProcessorCount=4'
    }
    verificationClient {
        client()
        gameDirectory = project.file('run/verification-client')
        loadedMods = [checkedMod, checksMod]
        systemProperty 'oculifelis.checks.client', 'thaumaturgicbases'
        systemProperty 'oculifelis.checks.expectedDirectory', project.file('run/verification-client').absolutePath
        jvmArgument '-Xmx6G'
        jvmArgument '-XX:ActiveProcessorCount=6'
    }
}
